name: Mint LMS CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint PHP files
        run: |
          set -e
          find src views templates mint-lms.php -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  phpcs:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPCS (errors only)
        run: vendor/bin/phpcs --runtime-set ignore_warnings_on_exit 1 -p --report=full

  tests:
    name: Unit and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer arch
      - run: composer test:unit

  assets:
    name: JS and Tailwind build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

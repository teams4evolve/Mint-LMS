name: Mint LMS Checks

on:
  push:
    paths:
      - 'wp-content/plugins/mint-lms/**'
  pull_request:
    paths:
      - 'wp-content/plugins/mint-lms/**'

defaults:
  run:
    working-directory: wp-content/plugins/mint-lms

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run composer check
        run: composer check

      - name: Run integration tests
        run: composer test:integ

  plugin-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: wp-content/plugins/mint-lms

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets
        run: npm ci && npm run build

      - name: Set up WordPress
        run: |
          wp core download --path=/tmp/wp --quiet
          wp config create --path=/tmp/wp --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/wp --url=http://example.com --title=Test --admin_user=admin --admin_password=password --admin_email=admin@example.com --skip-email
          wp plugin install plugin-check --activate --path=/tmp/wp

      - name: Run Plugin Check on release tree
        env:
          WP_PATH: /tmp/wp
        run: bash scripts/plugin-check.sh
